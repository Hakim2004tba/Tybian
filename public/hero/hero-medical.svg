<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroGlow" cx="52%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#6C4CF1" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6C4CF1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6C4CF1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starField" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0A0714" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0714" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8A6FF"/>
      <stop offset="1" stop-color="#6C4CF1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="900" fill="#0A0714"/>
  <circle cx="470" cy="380" r="380" fill="url(#heroGlow)"/>

  <!-- subtle scientific stars/particles -->
  <g fill="#B8A6FF">
    <circle cx="120" cy="140" r="1.6" opacity=".7"/>
    <circle cx="740" cy="90" r="1.3" opacity=".5"/>
    <circle cx="820" cy="300" r="1.8" opacity=".6"/>
    <circle cx="90" cy="520" r="1.4" opacity=".5"/>
    <circle cx="200" cy="700" r="1.6" opacity=".6"/>
    <circle cx="650" cy="740" r="1.3" opacity=".5"/>
    <circle cx="770" cy="600" r="1.7" opacity=".6"/>
    <circle cx="60" cy="300" r="1.2" opacity=".4"/>
    <circle cx="500" cy="60" r="1.3" opacity=".5"/>
  </g>

  <!-- HUD scan rings -->
  <g stroke="#3A2E63" stroke-width="1" opacity=".55" fill="none">
    <circle cx="470" cy="380" r="230"/>
    <circle cx="470" cy="380" r="290"/>
    <line x1="150" y1="380" x2="790" y2="380"/>
    <line x1="470" y1="60" x2="470" y2="700"/>
  </g>

  <!-- anatomical heart line-art, focal point -->
  <path d="M470 520 C 320 430 270 340 330 280 C 370 240 435 255 470 305
           C 505 255 570 240 610 280 C 670 340 620 430 470 520 Z"
        fill="none" stroke="url(#lineGrad)" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- vessel branches -->
  <path d="M330 280 C 300 240 300 190 340 160" fill="none" stroke="#8F7FE0" stroke-width="2" opacity=".7"/>
  <path d="M610 280 C 640 240 640 190 600 160" fill="none" stroke="#8F7FE0" stroke-width="2" opacity=".7"/>

  <!-- ECG pulse line crossing -->
  <path d="M120 480 H320 l20 -60 30 120 25 -90 20 30 H780"
        fill="none" stroke="#22D3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>

  <!-- data readout labels -->
  <g fill="#7C7499" font-family="Inter, sans-serif" font-size="12" letter-spacing="2">
    <text x="150" y="120">CARDIOVASCULAR · SCAN</text>
    <text x="640" y="800">SYSTEM · ONLINE</text>
  </g>

  <rect width="900" height="900" fill="url(#starField)"/>
</svg>
